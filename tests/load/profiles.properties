# =====================================================================
# Workload profiles for the JMeter plans in this folder.
#
# Every value here is read by the plans through ${__P(name,default)}, so this
# file only ever overrides a default that already exists in the .jmx. Pass it
# with -q:
#
#   jmeter -n -t catalogue-browse.jmx -q profiles.properties -l results/run.jtl
#
# ...or override one value at a time on the command line, which wins over the
# file:
#
#   jmeter -n -t catalogue-browse.jmx -Jthreads=100 -Jduration=120 ...
#
# The four stages below are the strategy the architecture documents name:
# smoke, load, stress, spike. They are commented out because a properties file
# can only hold one set at a time - uncomment the stage being run, or use
# run.sh / run.ps1, which sets them from a stage name.
# =====================================================================

# ---------------------------------------------------------------------
# Where to point the run
# ---------------------------------------------------------------------
gateway.host=localhost
gateway.port=8080

# ---------------------------------------------------------------------
# Stage 2 — LOAD: the expected busy hour. This is the default.
# ---------------------------------------------------------------------
threads=20
rampup=30
duration=300

# Pause between requests, milliseconds: think.time to think.time+think.range.
# A load test without think time measures how fast the server can be flooded,
# not how it behaves for people.
think.time=500
think.range=1000

# Catalogue page size the browsing plan asks for. The SPA uses 12.
page.size=12

# ---------------------------------------------------------------------
# order-checkout.jmx only
# ---------------------------------------------------------------------
# Each thread registers its own throw-away account; this is the password it
# uses. It exists only in a development database - do not point this plan at
# an environment where that is not true.
shopper.password=LoadTest1

# Set to false to exercise cart traffic without placing orders. Ordering
# decrements real stock and writes real rows; see the cleanup note in
# README.md.
place.orders=true

# ---------------------------------------------------------------------
# The other three stages, for reference
# ---------------------------------------------------------------------
# Stage 1 - SMOKE: proves the plan and the stack agree before a long run.
#   threads=2  rampup=1   duration=60
#
# Stage 3 - STRESS: past the expected peak, to find where it bends.
#   threads=100 rampup=60  duration=600  think.time=200 think.range=300
#
# Stage 4 - SPIKE: everyone arrives at once, then leaves.
#   threads=200 rampup=5   duration=120  think.time=0   think.range=200
