<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="TechZone — Laptop E-commerce Platform built on a microservices architecture">
  <title>TechZone — Laptop E-commerce Platform</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111B33"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="980" cy="150" r="240" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" rx="2" fill="url(#accent)"/>

  <!-- wordmark -->
  <g transform="translate(80 96)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="16" font-weight="600" letter-spacing="6" fill="#7DD3FC">GRADUATION THESIS PROJECT</text>
    <text x="0" y="72" font-size="76" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Tech<tspan fill="url(#accent)">Zone</tspan></text>
    <text x="0" y="116" font-size="24" font-weight="500" fill="#94A3B8">Laptop E-commerce Platform · Microservices Architecture</text>
    <g transform="translate(0 148)" font-size="14" font-weight="600" fill="#CBD5E1">
      <rect x="0" y="-20" width="128" height="30" rx="15" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="18" y="0">Spring Boot 3.5</text>
      <rect x="142" y="-20" width="96" height="30" rx="15" fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="160" y="0">React 19</text>
      <rect x="252" y="-20" width="84" height="30" rx="15" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="270" y="0">Docker</text>
      <rect x="350" y="-20" width="82" height="30" rx="15" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/>
      <text x="368" y="0">Stripe</text>
    </g>
  </g>

  <!-- laptop -->
  <g transform="translate(880 78)">
    <rect x="0" y="0" width="300" height="186" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="12" width="276" height="162" rx="7" fill="url(#screen)"/>
    <rect x="30" y="32" width="120" height="10" rx="5" fill="#38BDF8" fill-opacity="0.85"/>
    <rect x="30" y="54" width="220" height="8" rx="4" fill="#475569"/>
    <rect x="30" y="72" width="180" height="8" rx="4" fill="#475569"/>
    <g fill="#0F172A" stroke="#334155">
      <rect x="30" y="98" width="66" height="56" rx="8"/>
      <rect x="112" y="98" width="66" height="56" rx="8"/>
      <rect x="194" y="98" width="66" height="56" rx="8"/>
    </g>
    <g fill="url(#accent)" opacity="0.9">
      <rect x="40" y="108" width="46" height="6" rx="3"/>
      <rect x="122" y="108" width="46" height="6" rx="3"/>
      <rect x="204" y="108" width="46" height="6" rx="3"/>
    </g>
    <g fill="#64748B">
      <rect x="40" y="124" width="30" height="5" rx="2.5"/>
      <rect x="122" y="124" width="30" height="5" rx="2.5"/>
      <rect x="204" y="124" width="30" height="5" rx="2.5"/>
    </g>
    <rect x="-30" y="192" width="360" height="14" rx="7" fill="#334155"/>
    <rect x="120" y="196" width="60" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- service nodes -->
  <g transform="translate(80 292)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">
    <circle cx="4" cy="-4" r="4" fill="#38BDF8"/>
    <text x="18" y="0">7 Spring services</text>
    <circle cx="164" cy="-4" r="4" fill="#818CF8"/>
    <text x="178" y="0">Eureka + Gateway</text>
    <circle cx="334" cy="-4" r="4" fill="#A78BFA"/>
    <text x="348" y="0">RabbitMQ events</text>
    <circle cx="504" cy="-4" r="4" fill="#34D399"/>
    <text x="518" y="0">One-command Docker stack</text>
  </g>
</svg>
